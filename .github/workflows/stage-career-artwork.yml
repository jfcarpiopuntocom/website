name: Stage career artwork
on:
  push:
    branches: [feature/career-journey-frame]
permissions:
  contents: write
jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/career-journey-frame
      - name: Download exact approved artwork
        run: |
          mkdir -p assets
          curl --fail --location 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-1a44-81f5-b3e2-777644c0a356/raw?se=2026-09-30T04%3A21%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=ea2287f5-f907-4894-8704-2310aa8d2f5e&skoid=2757bbe4-5137-4324-975b-acedc0bad279&skt=2026-09-29T23%3A17%3A29Z&ske=2026-09-30T23%3A17%3A29Z&sks=b&skv=2026-02-06&sig=184KBP2k5Wd0Ztb4IqtJWJTPvU59ximfOh10Z%2Bw0USg%3D' --output assets/jfcarpio-career-journey.png
          file assets/jfcarpio-career-journey.png
          test "$(stat -c%s assets/jfcarpio-career-journey.png)" -gt 1000000
      - name: Commit binary asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jfcarpio-career-journey.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: add HD career journey artwork"
          git push
