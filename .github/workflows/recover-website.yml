name: Recover jfcarpio.com Worker source

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-jfcarpio-website
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate correct source
        run: |
          test "${GITHUB_REPOSITORY}" = "jfcarpiopuntocom/website"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(sed -n 's/^name = "\(.*\)"/\1/p' wrangler.toml | head -1)" = website
          test -f worker.js
          test -f index.html
          if grep -q 'SAFeguard NUCLEAR' index.html || grep -q 'AISLAMIENTO DE ALMACENAMIENTO' index.html; then
            echo 'Refusing to deploy the friendly-123 app as website'; exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare credentials missing in website repository secrets'; exit 1
          fi
      - name: Repair Builds repository connection
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as res: result = json.load(res)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'Cloudflare {method} {path}: HTTP {e.code}, {e.read().decode()[:500]}')
              if not result.get('success'):
                  raise RuntimeError(f'Cloudflare {method} {path}: {result.get("errors")}')
              return result['result']
          scripts = api('GET', '/workers/scripts')
          matches = [s for s in scripts if s.get('id') == 'website']
          if len(matches) != 1 or not matches[0].get('tag'):
              raise RuntimeError('Could not uniquely identify website Worker tag')
          tag = matches[0]['tag']
          triggers = api('GET', f'/builds/workers/{tag}/triggers')
          wrong = [t for t in triggers if (t.get('repo_connection') or {}).get('repo_name') == 'friendly-123'
                   and (t.get('repo_connection') or {}).get('provider_account_name') == 'jfcarpiopuntocom']
          correct = [t for t in triggers if (t.get('repo_connection') or {}).get('repo_name') == 'website'
                     and (t.get('repo_connection') or {}).get('provider_account_name') == 'jfcarpiopuntocom']
          if len(wrong) > 1 or len(correct) > 1:
              raise RuntimeError('Unexpected duplicate build triggers; refusing ambiguous changes')
          if not correct:
              if len(wrong) != 1 or not wrong[0].get('build_token_uuid'):
                  raise RuntimeError('No known build token to restore website Git integration')
              connection = api('PUT', '/builds/repos/connections', {
                  'provider_type': 'github',
                  'provider_account_id': '180065745',
                  'provider_account_name': 'jfcarpiopuntocom',
                  'repo_id': '1182956151',
                  'repo_name': 'website'
              })
              uuid = connection.get('repo_connection_uuid')
              if not uuid: raise RuntimeError('No repository connection UUID returned')
              api('POST', '/builds/triggers', {
                  'external_script_id': tag,
                  'repo_connection_uuid': uuid,
                  'build_token_uuid': wrong[0]['build_token_uuid'],
                  'trigger_name': 'website main production',
                  'build_command': '',
                  'deploy_command': 'npx wrangler deploy',
                  'root_directory': '/',
                  'branch_includes': ['main'],
                  'branch_excludes': [],
                  'path_includes': ['*'],
                  'path_excludes': []
              })
              print('Restored website/main build trigger')
          for t in wrong:
              api('DELETE', '/builds/triggers/' + t['trigger_uuid'])
              print('Removed friendly-123 trigger from website Worker')
          updated = api('GET', f'/builds/workers/{tag}/triggers')
          names = [(t.get('repo_connection') or {}).get('repo_name') for t in updated]
          if 'friendly-123' in names or 'website' not in names:
              raise RuntimeError('Website build source did not verify: ' + str(names))
          print('Verified website Worker builds from website repository')
          PY
      - name: Deploy current website/main
        run: npx -y wrangler@4.141.0 deploy --config wrangler.toml
      - name: Verify public homepage
        run: |
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 \
            "https://jfcarpio.com/?recovery=${GITHUB_SHA}" -o /tmp/homepage.html
          if grep -q 'AISLAMIENTO DE ALMACENAMIENTO' /tmp/homepage.html; then
            echo 'App is still serving at jfcarpio.com'; exit 1
          fi
          grep -qi 'jfcarpio' /tmp/homepage.html
          echo 'Verified jfcarpio.com serves website content'
