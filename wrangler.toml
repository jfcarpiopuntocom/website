name = "website"
main = "worker.js"
routes = [
  { pattern = "jfcarpio.com/*", zone_name = "jfcarpio.com" },
  { pattern = "www.jfcarpio.com/*", zone_name = "jfcarpio.com" },
  { pattern = "blog.jfcarpio.com/*", zone_name = "jfcarpio.com" },
  { pattern = "apps.jfcarpio.com", custom_domain = true },
  { pattern = "consultor.jfcarpio.com", custom_domain = true },
  { pattern = "workshops.jfcarpio.com", custom_domain = true },
  { pattern = "launch-review.jfcarpio.com", custom_domain = true },
  { pattern = "market-intelligence.jfcarpio.com", custom_domain = true },
  { pattern = "pacific-basin.jfcarpio.com", custom_domain = true },
  { pattern = "dinero.jfcarpio.com", custom_domain = true },
]
compatibility_date = "2025-09-27"

[assets]
directory = "./"
binding = "ASSETS"
# El Worker corre primero: redirige www y pone cabeceras de seguridad en todo.
run_worker_first = true
not_found_handling = "404-page"

# IndexNow diario (ver scheduled() en worker.js)
[triggers]
crons = ["23 11 * * *"]
