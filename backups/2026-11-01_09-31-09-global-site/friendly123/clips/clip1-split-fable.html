<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One sale, split fairly</title>
<!--
  clip1-split-fable.html — friendly-123 landing clip (Fable 5.1, 2026-09-24).
  NOTAS PARA QUIEN LO TOQUE DESPUES (JFC / Opus 5.5):
  - Es 1:1, sin dependencias, sin JS de terceros, sin fuentes externas: carga
    en un iframe loading="lazy" del hero, max 420px. Loop de 9 s.
  - Cuenta UNA historia: una venta de $50 entra por la percha, se parte en
    dos (60 % artista, 40 % casa), y el semaforo de la percha pasa de amarillo
    a verde. Es exactamente lo que hace Commissions; no es decoracion.
  - Estetica: papel, tinta, UN acento (verde SIMON) y numeros tabulares. Nada
    de degradados brillantes, sombras blandas ni emojis. La restriccion es la
    marca. No agregar "wow" que no cuente la historia.
  - Legibilidad: minimo 13 px, sin texto gris. prefers-reduced-motion deja
    el fotograma final quieto.
  - Colores: --paper #F6F1E7, --ink #17150F, --verde #0B7A4B (tinta, 5:1
    sobre papel), --amarillo #FFC700 solo como relleno (nunca bajo texto).
-->
<style>
  :root{--paper:#F6F1E7;--ink:#17150F;--verde:#0B7A4B;--amarillo:#FFC700;--linea:#17150F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper)}
  body{font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);display:grid;place-items:center;overflow:hidden}
  .stage{position:relative;width:min(100vw,100vh);aspect-ratio:1/1;padding:6%;display:grid;grid-template-rows:auto 1fr auto;gap:4%}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .top{display:flex;justify-content:space-between;align-items:baseline;font-size:clamp(13px,3.4vw,16px);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .top .mes{font-weight:600;letter-spacing:.02em;text-transform:none}
  /* percha */
  .rack{position:relative;border:2.5px solid var(--linea);border-radius:14px;padding:5% 6%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:3% 5%;overflow:hidden}
  .rack .name{grid-column:1/-1;font-size:clamp(15px,4.2vw,20px);font-weight:700;display:flex;align-items:center;gap:.5em}
  .dot{width:.75em;height:.75em;border-radius:50%;background:var(--amarillo);border:2px solid var(--ink);animation:dot 9s linear infinite}
  .side{border:2px solid var(--linea);border-radius:10px;padding:6% 7%;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
  .side h3{font-size:clamp(13px,3.3vw,15px);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .side .amt{font-size:clamp(28px,9vw,44px);font-weight:700;line-height:1;margin-top:.3em}
  .side .pct{font-size:clamp(13px,3.3vw,15px);font-weight:700;margin-top:.5em}
  .artist{background:#fff}
  .artist .amt{color:var(--verde)}
  /* la venta que entra */
  .sale{position:absolute;left:50%;top:-22%;transform:translateX(-50%);width:44%;padding:3% 4%;border:2.5px solid var(--linea);border-radius:999px;background:#fff;font-weight:700;font-size:clamp(14px,4vw,19px);text-align:center;animation:sale 9s cubic-bezier(.2,.8,.2,1) infinite;box-shadow:0 0 0 4px var(--paper)}
  .sale small{display:block;font-weight:600;font-size:.72em;letter-spacing:.04em;text-transform:uppercase}
  /* contadores */
  .a1,.a2{display:inline-block;overflow:hidden;height:1em;vertical-align:bottom}
  .a1 span,.a2 span{display:block;animation:count 9s steps(1,end) infinite}
  .bottom{display:flex;justify-content:space-between;align-items:baseline;font-size:clamp(13px,3.4vw,16px);font-weight:600}
  .bottom strong{font-weight:700}
  .bar{position:relative;height:10px;border:2px solid var(--linea);border-radius:999px;overflow:hidden;margin-top:2%}
  .bar i{position:absolute;inset:0;background:var(--verde);transform-origin:left;transform:scaleX(.42);animation:bar 9s cubic-bezier(.2,.8,.2,1) infinite}
  .split{position:absolute;left:50%;top:50%;width:2.5px;height:0;background:var(--linea);transform:translateX(-50%);animation:split 9s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes sale{0%,8%{top:-22%;opacity:0}16%{top:36%;opacity:1}42%{top:36%;opacity:1}50%{top:52%;opacity:0;transform:translateX(-50%) scale(.6)}100%{top:52%;opacity:0}}
  @keyframes split{0%,44%{height:0}52%{height:40%}92%{height:40%}100%{height:0}}
  @keyframes count{0%,50%{transform:translateY(0)}52%,100%{transform:translateY(-1em)}}
  @keyframes bar{0%,50%{transform:scaleX(.42)}60%,100%{transform:scaleX(.78)}}
  @keyframes dot{0%,58%{background:var(--amarillo)}62%,100%{background:var(--verde)}}
  @media (prefers-reduced-motion:reduce){
    .sale,.split,.a1 span,.a2 span,.bar i,.dot{animation:none}
    .sale{opacity:0}.split{height:40%}.a1 span,.a2 span{transform:translateY(-1em)}.bar i{transform:scaleX(.78)}.dot{background:var(--verde)}
  }
</style>
</head>
<body>
<div class="stage" role="img" aria-label="A fifty dollar sale on a consignment shelf splits into thirty for the artist and twenty for the house; the shelf turns green as it reaches its monthly goal.">
  <div class="top"><span>Commissions</span><span class="mes mono">September</span></div>
  <div class="rack">
    <div class="name"><span class="dot" aria-hidden="true"></span>Ana's shelf · 60 / 40</div>
    <div class="side artist"><h3>Artist</h3><div><div class="amt mono">$<span class="a1"><span>210<br>240</span></span></div><div class="pct">60 % per sale</div></div></div>
    <div class="side"><h3>House</h3><div><div class="amt mono">$<span class="a2"><span>140<br>160</span></span></div><div class="pct">40 % per sale</div></div></div>
    <div class="split" aria-hidden="true"></div>
    <div class="sale mono" aria-hidden="true"><small>Sold</small>$50 print</div>
  </div>
  <div>
    <div class="bottom"><span>Monthly goal <strong class="mono">$500</strong></span><span class="mono"><strong><span class="a1"><span>$350<br>$400</span></span></strong></span></div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
</div>
</body>
</html>
