<script>!function(){"use strict";var e={es:{brand:["Busca","Clientes"],back:"← Volver a buscar",eyebrow:"CENTRO DE AYUDA",title:"Encuentra clientes en cualquier ciudad, en tres pasos",lead:"BuscaClientes escanea la ciudad que elijas, junta varias fuentes de datos y te entrega negocios con teléfono, correo, web y WhatsApp cuando existen. Los que te interesan los guardas en tu Agenda Inteligente.",s1:"Elige país y ciudad",s1d:"Escribe la ciudad y elígela de la lista para que la búsqueda caiga en el lugar exacto.",s2:"Elige la actividad",s2d:"Abogados, dentistas, arquitectos, cafeterías y más de 50 actividades. La palabra clave es opcional.",s3:"Pulsa Explorar",s3d:'Verás "Escaneando la ciudad…" y en segundos aparece el resumen con cuántos negocios encontramos.',c1:"Qué vas a ver",c1d:"Arriba, el total y cuántos traen teléfono, web, correo o WhatsApp. En cada ficha, toca el teléfono para llamar, el correo para escribir o la web para visitarla. Hasta 600 resultados por búsqueda.",chipPhone:"Llamar",chipMail:"Escribir",chipWeb:"Visitar web",c2:"Tu Agenda Inteligente (CRM)",c2d:'Pulsa "Guardar contacto" y el negocio pasa a Guardados en mi Agenda. Ahí añades notas, etapas y próximos pasos. Gratis: 7 contactos nuevos por semana. Buscar y exportar no tienen límite.',c3:"Datos empresariales de todo el mundo",c3d:"Nuestro motor cruza varias bases de datos empresariales y profesionales internacionales y las une en una sola ficha por negocio, con la fecha en que se consultó.",chipDir:"Directorios profesionales",c4:"Exporta tus resultados",c4d:"Descarga los resultados en CSV o Excel, o cópialos al portapapeles para pegarlos en tu hoja de cálculo. También puedes exportar lo que guardaste en tu Agenda Inteligente.",faqTitle:"Preguntas frecuentes",q:"Busca en la ayuda: precio, Excel, WhatsApp…",faq:[["¿Cuánto cuesta?","Buscar y exportar resultados es gratis y sin límite. La Agenda Inteligente gratis guarda 7 contactos nuevos por semana. Los planes Plus (70) y Pro (250) están en preparación."],["¿Por qué mi ciudad trae pocos resultados?","Algunas ciudades y actividades tienen menos negocios registrados en las fuentes. Prueba una actividad cercana, una ciudad vecina más grande o quita la palabra clave. Seguimos sumando fuentes cada semana."],["¿Por qué la primera búsqueda en una ciudad tarda unos segundos?","La primera vez la app trae los datos de esa ciudad. Después, cambiar de actividad en la misma ciudad es casi instantáneo."],["¿Los teléfonos y correos están verificados?","Son los datos que cada negocio publicó en las fuentes. Pueden cambiar: confirma antes de enviar una propuesta. La fecha de consulta aparece en cada ficha."],["¿Dónde se guarda mi Agenda Inteligente?",'En tu propio dispositivo, dentro del navegador. No creamos una cuenta ni subimos tus contactos. Para cambiar de teléfono o computadora usa "Respaldar mi Agenda Inteligente".'],["¿Funciona en mi país?","Sí. La búsqueda cubre ciudades de todo el mundo. La cantidad de resultados depende de cada ciudad."],["¿Puedo instalarla como app?",'Sí, en el teléfono o la computadora, sin tienda de aplicaciones. Mira "Instalar la app".'],['¿Qué es "Encontrar contactos"?',"Una ayuda opcional que lee la web del negocio, abierta por ti, para completar datos que falten en la ficha."]],ctaSearch:"🔎 Buscar clientes ahora",ctaInstall:"📲 Instalar la app",ctaKit:"🎁 Kit gratuito",fAbout:"Acerca de",fPlans:"Planes",fPrivacy:"Privacidad",fTerms:"Términos",fBackup:"Respaldar mi Agenda Inteligente",doc:"Centro de ayuda · BuscaClientes: Búsqueda + Agenda Inteligente"},en:{brand:["Find","Clients"],back:"← Back to search",eyebrow:"HELP CENTER",title:"Find clients in any city, in three steps",lead:"FindClients scans the city you choose, combines several data sources and gives you businesses with phone, email, website and WhatsApp when available. Save the ones you like in your Smart Agenda.",s1:"Pick country and city",s1d:"Type the city and choose it from the list so the search lands on the exact place.",s2:"Pick the activity",s2d:"Lawyers, dentists, architects, cafés and 50+ more. The keyword is optional.",s3:"Press Explore",s3d:'You will see "Scanning the city…" and in seconds the summary shows how many businesses we found.',c1:"What you will see",c1d:"On top, the total and how many have phone, website, email or WhatsApp. On each card, tap the phone to call, the email to write or the website to visit. Up to 600 results per search.",chipPhone:"Call",chipMail:"Email",chipWeb:"Visit website",c2:"Your Smart Agenda (CRM)",c2d:'Press "Save contact" and the business goes to Saved in my Smart Agenda. Add notes, stages and next steps there. Free: 7 new contacts per week. Search and export are unlimited.',c3:"Worldwide business data",c3d:"Our engine cross-checks several international business and professional databases and merges them into one card per business, with the date it was looked up.",chipDir:"Professional directories",c4:"Export your results",c4d:"Download results as CSV or Excel, or copy them to the clipboard for your spreadsheet. You can also export what you saved in your Smart Agenda.",faqTitle:"Frequently asked questions",q:"Search help: price, Excel, WhatsApp…",faq:[["How much does it cost?","Searching and exporting are free and unlimited. The free Smart Agenda saves 7 new contacts per week. Plus (70) and Pro (250) plans are in preparation."],["Why does my city show few results?","Some cities and activities have fewer businesses listed in the sources. Try a related activity, a larger nearby city, or remove the keyword. We add sources every week."],["Why does the first search in a city take a few seconds?","The first time, the app brings that city's data. After that, switching activity in the same city is almost instant."],["Are phones and emails verified?","They are the details each business listed in the sources. They can change: confirm before sending a proposal. The lookup date appears on every card."],["Where is my Smart Agenda stored?",'On your own device, i
